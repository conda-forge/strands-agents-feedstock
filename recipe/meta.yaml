{% set name = "strands-agents" %}
{% set version = "1.68.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/strands_agents-{{ version }}.tar.gz
  sha256: fe0650d7a3b28ab88fbce8dc93af57ec293a47dbf30db8929159a2d0b22fc09a

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >={{ python_min }}
    - boto3 >=1.26.0,<2.0.0
    - botocore >=1.29.0,<2.0.0
    - docstring_parser >=0.15,<1.0
    - httpx >=0.28.1,<1.0.0
    - jsonschema >=4.0.0,<5.0.0
    - mcp >=1.23.0,<2.4
    - pydantic >=2.4.0,<3.0.0
    - pyyaml >=6.0.0,<7.0.0
    - typing_extensions >=4.13.2,<5.0.0
    - watchdog >=6.0.0,<7.0.0
    - opentelemetry-api >=1.30.0,<2.0.0
    - opentelemetry-sdk >=1.30.0,<2.0.0
    - opentelemetry-instrumentation-threading >=0.51b0,<1.00b0

test:
  imports:
    - strands
    - strands.tools.mcp
  commands:
    - pip check
    - python -c "from strands import Agent"
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/strands-agents/harness-sdk
  summary: A model-driven approach to building AI agents in just a few lines of code
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  doc_url: https://strandsagents.com
  dev_url: https://github.com/strands-agents/harness-sdk

extra:
  recipe-maintainers:
    - yonib05
    - Unshure
    - athkulk
    - giswqs
